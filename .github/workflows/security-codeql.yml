name: ZUVYR CodeQL Security Gate

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 5'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: zuvyr-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3, resolved 2026-09-24
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3, resolved 2026-09-24
        with:
          category: '/language:javascript-typescript'
