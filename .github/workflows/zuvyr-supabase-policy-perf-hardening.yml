name: ZUVYR Supabase Security Hardening

on:
  pull_request:
    paths:
      - 'backend/93_zuvyr_supabase_policy_perf_hardening.sql'
      - 'backend/test-zuvyr-supabase-policy-perf-hardening.js'
      - 'backend/93_zuvyr_server_only_privilege_hardening.sql'
      - 'backend/test-zuvyr-server-only-privilege-hardening.js'
      - '.github/workflows/zuvyr-supabase-policy-perf-hardening.yml'
  push:
    branches: [main]
    paths:
      - 'backend/93_zuvyr_supabase_policy_perf_hardening.sql'
      - 'backend/test-zuvyr-supabase-policy-perf-hardening.js'
      - 'backend/93_zuvyr_server_only_privilege_hardening.sql'
      - 'backend/test-zuvyr-server-only-privilege-hardening.js'
      - '.github/workflows/zuvyr-supabase-policy-perf-hardening.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify policy performance migration contract
        run: node backend/test-zuvyr-supabase-policy-perf-hardening.js
      - name: Verify server-only privilege migration contract
        run: node backend/test-zuvyr-server-only-privilege-hardening.js
