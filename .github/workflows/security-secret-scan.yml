name: ZUVYR Secret History Gate

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 5'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: zuvyr-secret-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2, resolved tag target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
