name: ZUVYR CodeQL Security Gate

on:
  push:
    branches:
      - main
      - 'audit/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 5'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: zuvyr-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4 pinned 2026-09-24
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4 pinned 2026-09-24
        with:
          category: '/language:javascript-typescript'

      - name: Enforce High/Critical CodeQL policy
        run: node tools/check-codeql-sarif.cjs "${{ steps.analyze.outputs.sarif-output }}"
