name: ZUVYR Continuous Improvement Policy

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/zuvyr/CONTINUOUS_IMPROVEMENT_OVERRIDE_2026-09-23.md'
      - 'docs/zuvyr/continuous-improvement-override.v1.json'
      - 'tools/validate-continuous-improvement-override.cjs'
      - '.github/workflows/continuous-improvement-policy.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/zuvyr/CONTINUOUS_IMPROVEMENT_OVERRIDE_2026-09-23.md'
      - 'docs/zuvyr/continuous-improvement-override.v1.json'
      - 'tools/validate-continuous-improvement-override.cjs'
      - '.github/workflows/continuous-improvement-policy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate continuous-improvement override
        run: node tools/validate-continuous-improvement-override.cjs
