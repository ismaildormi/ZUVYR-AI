name: ZUVYR Level 3 Usage Autofix Once

on:
  push:
    branches:
      - feat/zuvyr-live-ops-level2-3-20260924

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/zuvyr-live-ops-level2-3-20260924
          fetch-depth: 1

      - name: Apply Usage surface and visual-gate fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          js_path = Path('frontend/zuvyr-suite-v1.js')
          js = js_path.read_text()
          js = replace_once(
              js,
              '''  function usageView() {\n    return suite.querySelector('[data-zs-view="usage"]');\n  }''',
              '''  function usageViewNode() {\n    return suite.querySelector('[data-zs-view="usage"]');\n  }\n\n  function usageSurfaceView() {\n    return heading('usage') +\n      '<div class="zs-grid"><div class="zs-card wide">' +\n        '<div data-zs-usage-content><div class="zs-muted" role="status">Loading usage…</div></div>' +\n      '</div></div>';\n  }''',
              'usage view naming collision',
          )
          js = replace_once(js, 'const view = usageView();', 'const view = usageViewNode();', 'renderUsage DOM lookup')
          js = replace_once(js, "if(id==='usage')return usageView();", "if(id==='usage')return usageSurfaceView();", 'viewHtml usage renderer')
          js_path.write_text(js)

          qa_path = Path('tools/visual-qa/run.mjs')
          qa = qa_path.read_text()
          qa = replace_once(
              qa,
              'summary:{critical:0,serious:0,moderate:0,overflowFailures:0,duplicateIdFailures:0,missingViews:0}',
              'summary:{critical:0,serious:0,moderate:0,overflowFailures:0,duplicateIdFailures:0,missingViews:0,renderFailures:0,consoleFailures:0}',
              'visual QA extra failure counters',
          )
          qa = replace_once(
              qa,
              "      title:active&&active.querySelector('h1')?.textContent?.trim()||null,\n      visibleText:active?.innerText?.slice(0,40000)||'',",
              "      title:active&&active.querySelector('h1')?.textContent?.trim()||null,\n      visibleText:active?.innerText?.slice(0,40000)||'',\n      renderFailure:!active||!active.querySelector('h1')||/^(null|undefined)$/i.test((active.innerText||'').trim()),",
              'visual QA rendered-view guard',
          )
          qa = replace_once(
              qa,
              "    if(evidence.horizontalOverflow){report.summary.overflowFailures++;failed=true;}",
              "    if(evidence.horizontalOverflow){report.summary.overflowFailures++;failed=true;}\n    if(evidence.renderFailure){report.summary.renderFailures++;failed=true;}\n    if(evidence.consoleErrors.length){report.summary.consoleFailures++;failed=true;}",
              'visual QA render and console gates',
          )
          qa = replace_once(
              qa,
              "  `Missing views: ${report.summary.missingViews}`,",
              "  `Missing views: ${report.summary.missingViews}`,\n  `Render failures: ${report.summary.renderFailures}`,\n  `Views with console errors: ${report.summary.consoleFailures}`,",
              'visual QA render and console summary',
          )
          qa_path.write_text(qa)
          PY

          node --check frontend/zuvyr-suite-v1.js
          node --check tools/visual-qa/run.mjs
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zuvyr-level3-usage-autofix-once.yml
          git add frontend/zuvyr-suite-v1.js tools/visual-qa/run.mjs
          git commit -m "fix: render Usage surface and gate visual regressions"
          git push origin HEAD:feat/zuvyr-live-ops-level2-3-20260924
