name: ZUVYR one-shot root brand and CLI acceptance

on:
  push:
    branches:
      - fix/infra-level3-brand-clean-20260924
    paths:
      - .github/workflows/_zuvyr-one-shot-root-brand-cli.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/infra-level3-brand-clean-20260924
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Align root identity and canonical continuity atomically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json

          def dump(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def blob_sha(path):
              data = Path(path).read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['name'] = 'zuvyr-ai'
          pkg['description'] = 'ZUVYR — safe operational tooling, isolated profiles, read-only live verification, smoke tests, and guarded staging/production deployment.'
          bins = dict(pkg.get('bin') or {})
          bins['zuvyr'] = './cli/rox.js'
          bins['rox'] = './cli/rox.js'
          pkg['bin'] = bins
          dump(pkg_path, pkg)

          lock_path = Path('package-lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['name'] = 'zuvyr-ai'
          root = lock.setdefault('packages', {}).setdefault('', {})
          root['name'] = 'zuvyr-ai'
          lock_bins = dict(root.get('bin') or {})
          lock_bins['zuvyr'] = 'cli/rox.js'
          lock_bins['rox'] = 'cli/rox.js'
          root['bin'] = lock_bins
          dump(lock_path, lock)

          state_path = Path('docs/zuvyr/ZUVYR_CURRENT_STATE_OVERRIDE_2026-09-23.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['schema_version'] = '1.7'
          state['updated_at'] = now
          state['repository'] = 'ismaildormi/ZUVYR-AI'
          state['source_main_before_this_reconciliation'] = '928c09ccfde3b03d1cc31ca417a2fc2ba258efa5'
          active = state.setdefault('active_work', {})
          active['pack'] = 'PACK089'
          active['pack_status'] = 'IN_PROGRESS'
          active['phase'] = '89E_PRODUCTION_ACCEPTANCE'
          active['phase_status'] = 'OAUTH_CONNECTED_FINAL_ACCEPTANCE_PENDING'
          active['pack090_allowed'] = False
          active['interactive_owner_consent_completed'] = True
          active['google_oauth_values_or_google_side_validity'] = 'PRODUCTION_OWNER_CONSENT_AND_CALLBACK_CONFIRMED'
          active['next_legal_step'] = 'Verify a granted-scope Google Drive read/export tool call, prove denied write/scope behavior, disconnect/revoke, prove post-revoke denial, then verify audit persistence and Vault/plaintext-secret cleanliness. Do not start PACK090 first.'
          active['oauth_callback_production'] = {
              'status': 'PASS_OWNER_CONSENT_CALLBACK_COMPLETED',
              'checked_through': now
          }
          active['google_testing_audience'] = {
              'status': 'RESOLVED_OWNER_CONSENT_COMPLETED',
              'previous_status': 'BLOCKED_TEST_USER_ALLOWLIST',
              'resolution_evidence': 'Fresh production DB shows one active connected Google Drive connection after one consumed OAuth session.'
          }
          active['google_drive_connection_current'] = {
              'status': 'active',
              'connected': True,
              'scopes': ['drive.export', 'drive.file.read'],
              'explicit_consent': True,
              'read_enabled': True,
              'write_enabled': False,
              'consumed_oauth_sessions': 1,
              'active_unconsumed_oauth_sessions': 0,
              'pack089_temporary_vault_residue_count': 0,
              'observed_from': 'fresh Supabase production evidence 2026-09-24'
          }
          infra = state.setdefault('infrastructure', {})
          infra['supabase_status'] = 'ACTIVE_HEALTHY_POST_PACK089_IDEMPOTENCY_MIGRATION'
          infra['railway_services_latest_status'] = 'SUCCESS_ON_MAIN_928C09CC'
          infra['railway_pending_work'] = 0
          infra['railway_backend_deployment'] = 'a5b8514a-db05-4307-99c2-ce379d86006b'
          infra['railway_worker_deployment'] = 'cb23049c-be86-4b6f-b7d1-b3f3c00f1483'
          infra['railway_maintenance_deployment'] = 'bac8ad1c-46d4-4201-8d76-bbb29aaf0e0c'
          infra['vercel_post_reconciliation_main_behavior'] = 'Production deployment for main 928c09ccfde3b03d1cc31ca417a2fc2ba258efa5 reached READY after PACK089/Supabase cleanup.'
          gates = state.get('known_unresolved_gates') or []
          gates = [g for g in gates if not str(g).startswith('PACK089 real Google OAuth production acceptance')]
          gates.insert(0, 'PACK089 final Google Drive production acceptance: granted read/export call, denied write/scope proof, disconnect/revoke, post-revoke denial, audit persistence and Vault/plaintext-secret cleanliness')
          state['known_unresolved_gates'] = gates
          dump(state_path, state)

          state_sha = blob_sha(state_path)
          pkg_sha = blob_sha(pkg_path)

          manifest_path = Path('docs/zuvyr/ZUVYR_CONTINUITY_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['schema_version'] = '2.7'
          manifest['updated_at'] = now
          manifest['repository'] = 'ismaildormi/ZUVYR-AI'
          manifest['last_reconciled_git_head_before_manifest_update'] = '928c09ccfde3b03d1cc31ca417a2fc2ba258efa5'
          manifest.setdefault('current_state_override', {})['blob_sha'] = state_sha
          if isinstance(manifest.get('canonical_files_snapshot'), dict):
              if str(state_path) in manifest['canonical_files_snapshot']:
                  manifest['canonical_files_snapshot'][str(state_path)] = state_sha
              if 'package.json' in manifest['canonical_files_snapshot']:
                  manifest['canonical_files_snapshot']['package.json'] = pkg_sha
          manifest.setdefault('integrity_guard_files', {})['package.json'] = pkg_sha
          m_active = manifest.setdefault('active_work', {})
          m_active['pack'] = 'PACK089'
          m_active['pack_status'] = 'IN_PROGRESS'
          m_active['phase'] = '89E_PRODUCTION_ACCEPTANCE'
          m_active['phase_status'] = 'OAUTH_CONNECTED_FINAL_ACCEPTANCE_PENDING'
          m_active['pack090_allowed'] = False
          m_active['interactive_google_consent_completed'] = True
          m_active['credential_values_nonempty_or_valid'] = 'PRODUCTION_OWNER_CONSENT_AND_CALLBACK_CONFIRMED'
          m_active['google_cloud_configuration_valid'] = 'PRODUCTION_OWNER_CONSENT_AND_CALLBACK_CONFIRMED'
          m_active['next_legal_step'] = active['next_legal_step']
          m_active['oauth_callback_production'] = active['oauth_callback_production']
          m_active['google_testing_audience'] = active['google_testing_audience']
          m_active['google_drive_connection_current'] = active['google_drive_connection_current']
          dump(manifest_path, manifest)
          PY

          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:cli
          npm run test:deploy
          npm run validate:release
          git diff --check

          rm -f .github/workflows/_zuvyr-one-shot-root-brand-cli.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align ZUVYR root identity and live continuity state'
          git push origin HEAD:fix/infra-level3-brand-clean-20260924
