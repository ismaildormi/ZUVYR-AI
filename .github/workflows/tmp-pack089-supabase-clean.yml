name: Temporary PACK089 Supabase Clean Hardening
on:
  push:
    branches:
      - fix/pack089-supabase-clean-oauth-20260924
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pack089-supabase-clean-oauth-20260924
          fetch-depth: 0
      - name: Apply evidence-based hardening
        run: python3 tools/tmp_pack089_supabase_clean.py
      - name: Commit patch and remove temporary helpers
        run: |
          git rm .github/workflows/tmp-pack089-supabase-clean.yml tools/tmp_pack089_supabase_clean.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/lib/workspaceConnectionRepository.js backend/lib/workspaceRoutes.js frontend/zuvyr-suite-v1.js supabase/functions/zuvyr-ops-mcp/index.ts backend/92_pack089_89e_clean_oauth_idempotency.sql backend/test-pack089-89e-oauth-cleanliness.js backend/package.json docs/zuvyr/ZUVYR_REMAINING_WORK.md
          git commit -m 'fix: make PACK089 OAuth clean and idempotent'
          git push origin HEAD:fix/pack089-supabase-clean-oauth-20260924
