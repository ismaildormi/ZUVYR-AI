name: ZUVYR Native Level 3 Autofix Once

on:
  push:
    branches:
      - feat/zuvyr-live-ops-level2-3-20260924

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/zuvyr-live-ops-level2-3-20260924
          fetch-depth: 1

      - name: Apply evidence-based native QA fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path=Path('frontend/index.html')
          html=index_path.read_text()

          # History already declares a tablist. Make its buttons actual tabs so aria-selected is legal.
          html,n_hist=re.subn(r'(<button\s+type="button"\s+class="rox-history-view"\s+)(data-rox-history-view=)',r'\1role="tab" \2',html)
          if n_hist < 2:
              raise SystemExit(f'history tabs: expected >=2 replacements, got {n_hist}')

          # Settings category buttons use aria-selected at runtime: expose the matching tab semantics.
          html,n_nav=re.subn(r'(<nav\s+class="rox-settings-nav"\s+)(aria-label=)',r'\1role="tablist" \2',html)
          if n_nav < 2:
              raise SystemExit(f'settings tablists: expected >=2 replacements, got {n_nav}')
          html,n_settings=re.subn(r'(<button\s+type="button"(?:\s+class="is-active")?\s+)(data-settings-target=)',r'\1role="tab" \2',html)
          if n_settings < 12:
              raise SystemExit(f'settings tabs: expected >=12 replacements, got {n_settings}')

          # The Home feature heading jumped from h1 to h3. Preserve styling while declaring the correct semantic level.
          count=html.count('<h3>AI Chat</h3>')
          if count < 2:
              raise SystemExit(f'home AI Chat heading: expected >=2 matches, got {count}')
          html=html.replace('<h3>AI Chat</h3>','<h3 aria-level="2">AI Chat</h3>')
          index_path.write_text(html)

          css_path=Path('frontend/zuvyr-chat-workspace-v1.css')
          css=css_path.read_text()
          old='body.zuvyr-ui #feature-chat.zuvyr-chat-workspace {'
          if css.count(old)!=2:
              raise SystemExit(f'chat active visibility selector: expected 2 matches, got {css.count(old)}')
          css=css.replace(old,'body.zuvyr-ui #feature-chat.active.zuvyr-chat-workspace {')
          css_path.write_text(css)

          qa_path=Path('tools/visual-qa/native-run.mjs')
          qa=qa_path.read_text()
          qa=qa.replace(
            "summary:{screens:0,missingRequired:0,critical:0,serious:0,moderate:0,overflowFailures:0,renderFailures:0,consoleFailures:0,duplicateIdFailures:0}",
            "summary:{screens:0,missingRequired:0,critical:0,serious:0,moderate:0,overflowFailures:0,renderFailures:0,consoleFailures:0,networkFailures:0,duplicateIdFailures:0}",1)
          qa=qa.replace(
            "async function inspect(page,id,viewport,consoleErrors){",
            "async function inspect(page,id,viewport,consoleErrors,networkErrors){",1)
          qa=qa.replace(
            "if(state.missing)return {...state,consoleErrors};",
            "if(state.missing)return {...state,consoleErrors,networkErrors};",1)
          qa=qa.replace(
            "return {...state,consoleErrors:[...new Set(consoleErrors)].slice(0,80),violations};",
            "return {...state,consoleErrors:[...new Set(consoleErrors)].slice(0,80),networkErrors:[...new Set(networkErrors)].slice(0,80),violations};",1)
          qa=qa.replace(
            "if(['script','stylesheet','font','image','media'].includes(req.resourceType()))return route.abort();",
            "if(req.resourceType()==='script')return route.fulfill({status:200,contentType:'application/javascript',body:''});\n    if(req.resourceType()==='stylesheet')return route.fulfill({status:200,contentType:'text/css',body:''});\n    if(['font','image','media'].includes(req.resourceType()))return route.fulfill({status:204,body:''});",1)
          qa=qa.replace(
            "const page=await context.newPage();const consoleErrors=[];\n  page.on('console',msg=>{if(msg.type()==='error')consoleErrors.push(msg.text());});\n  page.on('pageerror',err=>consoleErrors.push(err.message));",
            "const page=await context.newPage();const consoleErrors=[];const networkErrors=[];\n  page.on('console',msg=>{if(msg.type()==='error'&&!/^Failed to load resource:/i.test(msg.text()))consoleErrors.push(msg.text());});\n  page.on('pageerror',err=>consoleErrors.push(err.message));\n  page.on('requestfailed',req=>{try{const u=new URL(req.url());if(u.origin===new URL(baseUrl).origin)networkErrors.push('request_failed '+u.pathname+' '+String(req.failure()?.errorText||''));}catch(_){}});\n  page.on('response',res=>{try{const u=new URL(res.url());if(u.origin===new URL(baseUrl).origin&&res.status()>=400&&u.pathname!=='/favicon.ico')networkErrors.push('http_'+res.status()+' '+u.pathname);}catch(_){}});",1)
          qa=qa.replace(
            "const evidence=await inspect(page,item.id,viewport.name,consoleErrors);evidence.screenshot=filename;",
            "const evidence=await inspect(page,item.id,viewport.name,consoleErrors,networkErrors);evidence.screenshot=filename;",1)
          qa=qa.replace(
            "if(evidence.consoleErrors.length){report.summary.consoleFailures++;failed=true;}",
            "if(evidence.consoleErrors.length){report.summary.consoleFailures++;failed=true;}\n    if(evidence.networkErrors.length){report.summary.networkFailures++;failed=true;}",1)
          qa=qa.replace(
            "`Views with console errors: ${report.summary.consoleFailures}`,`Duplicate ID failures: ${report.summary.duplicateIdFailures}`",
            "`Views with console errors: ${report.summary.consoleFailures}`,`Views with local network errors: ${report.summary.networkFailures}`,`Duplicate ID failures: ${report.summary.duplicateIdFailures}`",1)
          qa_path.write_text(qa)
          PY

          node --check tools/visual-qa/native-run.mjs
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zuvyr-native-level3-autofix-once.yml
          git add frontend/index.html frontend/zuvyr-chat-workspace-v1.css tools/visual-qa/native-run.mjs
          git commit -m "fix: close native shell visual QA findings"
          git push origin HEAD:feat/zuvyr-live-ops-level2-3-20260924
