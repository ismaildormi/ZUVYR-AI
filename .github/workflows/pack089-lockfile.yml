name: PACK089 Generate Backend Lockfile

on:
  push:
    branches:
      - pack089-89b-official-mcp-sdk
    paths:
      - backend/package.json
      - .github/workflows/pack089-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pack089-89b-official-mcp-sdk
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate deterministic backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --save-exact @modelcontextprotocol/client@2.0.0
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "build: lock official MCP client SDK"
          git push origin HEAD:pack089-89b-official-mcp-sdk
