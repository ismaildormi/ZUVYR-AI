name: PACK051-PACK060 Historical Finalizers

on:
  pull_request:
    paths:
      - 'zuvyr-pack-evidence/reconciliations/2026-09-23-pack051-060-finalizers/receipt.json'
      - 'zuvyr-pack-evidence/pack-051/receipt.json'
      - 'zuvyr-pack-evidence/pack-052/receipt.json'
      - 'zuvyr-pack-evidence/pack-053/receipt.json'
      - 'zuvyr-pack-evidence/pack-054/receipt.json'
      - 'zuvyr-pack-evidence/pack-055/receipt.json'
      - 'zuvyr-pack-evidence/pack-056/receipt.json'
      - 'zuvyr-pack-evidence/pack-057/receipt.json'
      - 'zuvyr-pack-evidence/pack-058/receipt.json'
      - 'zuvyr-pack-evidence/pack-059/receipt.json'
      - 'zuvyr-pack-evidence/pack-060/receipt.json'
      - 'zuvyr-pack-evidence/pack-061/2026-09-17-final/receipt.json'
      - 'tools/validate-pack051-060-historical-finalizers.cjs'
      - '.github/workflows/pack051-060-historical-finalizers.yml'
  push:
    branches: [main]
    paths:
      - 'zuvyr-pack-evidence/reconciliations/2026-09-23-pack051-060-finalizers/receipt.json'
      - 'tools/validate-pack051-060-historical-finalizers.cjs'
      - '.github/workflows/pack051-060-historical-finalizers.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Validate historical finalizer chain
        run: node tools/validate-pack051-060-historical-finalizers.cjs
