name: ZUVYR Ops MCP

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/zuvyr-ops-mcp/**'
      - 'tools/test-zuvyr-ops-mcp-contract.cjs'
      - 'docs/zuvyr/OPS_MCP_CORS_AUTHORITY_DECISION_2026-09-25.md'
      - '.github/workflows/zuvyr-ops-mcp.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/zuvyr-ops-mcp/**'
      - 'tools/test-zuvyr-ops-mcp-contract.cjs'
      - 'docs/zuvyr/OPS_MCP_CORS_AUTHORITY_DECISION_2026-09-25.md'
      - '.github/workflows/zuvyr-ops-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Ops MCP Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify read-only owner-scoped MCP contract
        run: node tools/test-zuvyr-ops-mcp-contract.cjs
