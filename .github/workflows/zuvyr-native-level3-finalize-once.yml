name: ZUVYR Native Level 3 Finalize Once

on:
  push:
    branches:
      - feat/zuvyr-live-ops-level2-3-20260924

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/zuvyr-live-ops-level2-3-20260924
          fetch-depth: 1

      - name: Apply source-level mobile overflow and accessibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/zuvyr-native-responsive-fixes.css')
          css = css_path.read_text()
          marker = '/* ZUVYR native Level 3 final overflow source fixes */'
          block = r'''
          /* ZUVYR native Level 3 final overflow source fixes */
          @media (max-width:760px){
            body.zuvyr-ui :is(#feature-images,#feature-videos,#feature-roxip,#feature-chat,#feature-code,#feature-automations,#feature-history,#feature-settings)::before,
            body.zuvyr-ui :is(#feature-images,#feature-videos,#feature-roxip,#feature-chat,#feature-code,#feature-automations,#feature-history,#feature-settings)::after{
              display:none!important;
              content:none!important;
              width:0!important;
              height:0!important;
            }

            body.zuvyr-ui #feature-settings .rox-settings-nav{
              display:flex!important;
              width:100%!important;
              max-width:100%!important;
              min-width:0!important;
              flex-wrap:wrap!important;
              overflow:visible!important;
              gap:6px!important;
            }
            body.zuvyr-ui #feature-settings .rox-settings-nav>button{
              flex:1 1 108px!important;
              min-width:0!important;
              max-width:100%!important;
              white-space:normal!important;
            }
          }
          '''.strip() + '\n'
          if marker not in css:
              css = css.rstrip() + '\n\n' + block
              css_path.write_text(css)

          js_path = Path('frontend/zuvyr-unified-ux-v1.js')
          js = js_path.read_text()
          replacements = [
              ('<select name="ownershipKind"><option value="user">', '<select name="ownershipKind" aria-label="Compute ownership type"><option value="user">'),
              ('<select name="connectorKind"><option value="openai_compatible_https">', '<select name="connectorKind" aria-label="Compute connector type"><option value="openai_compatible_https">'),
          ]
          for old, new in replacements:
              count = js.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {count}')
              js = js.replace(old, new, 1)
          js_path.write_text(js)
          PY

          node --check frontend/zuvyr-unified-ux-v1.js
          git diff --check

      - name: Commit final fixes and remove one-shot workflow
        run: |
          rm .github/workflows/zuvyr-native-level3-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/zuvyr-native-responsive-fixes.css frontend/zuvyr-unified-ux-v1.js .github/workflows/zuvyr-native-level3-finalize-once.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: eliminate remaining native Level 3 overflow sources"
          git push origin HEAD:feat/zuvyr-live-ops-level2-3-20260924
