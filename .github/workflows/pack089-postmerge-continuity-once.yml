name: PACK089 Post-Merge Continuity Reconciliation Once

on:
  push:
    branches:
      - reconcile/pack089-postmerge-owner-acceptance-20260924
    paths:
      - tools/reconcile-pack089-postmerge-20260924.cjs
      - .github/workflows/pack089-postmerge-continuity-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reconcile/pack089-postmerge-owner-acceptance-20260924
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Reconcile canonical continuity
        run: node tools/reconcile-pack089-postmerge-20260924.cjs
      - name: Remove one-shot files before validation
        run: |
          rm -f tools/reconcile-pack089-postmerge-20260924.cjs
          rm -f .github/workflows/pack089-postmerge-continuity-once.yml
      - name: Validate continuity after final tree shape
        run: node tools/validate-zuvyr-continuity.cjs
      - name: Guard PACK090 remains blocked
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('docs/zuvyr/ZUVYR_CURRENT_STATE_OVERRIDE_2026-09-23.json','utf8'));
          const m=JSON.parse(fs.readFileSync('docs/zuvyr/ZUVYR_CONTINUITY_MANIFEST.json','utf8'));
          if(s.active_work.pack!=='PACK089'||s.active_work.phase!=='89E_PRODUCTION_ACCEPTANCE'||s.active_work.phase_status!=='OWNER_AUTH_ACCEPTANCE_PENDING'||s.active_work.pack090_allowed!==false) process.exit(1);
          if(m.active_work.pack090_allowed!==false) process.exit(1);
          console.log('PACK090_BLOCKED_AS_REQUIRED');
          NODE
      - name: Commit reconciled evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: reconcile PACK089 post-merge owner acceptance gate'
          git push origin HEAD:reconcile/pack089-postmerge-owner-acceptance-20260924
