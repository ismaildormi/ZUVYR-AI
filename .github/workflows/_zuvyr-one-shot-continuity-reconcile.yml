name: ZUVYR One Shot Continuity Reconcile
on:
  push:
    branches:
      - fix/level3-brand-current-main-20260924
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/level3-brand-current-main-20260924
          fetch-depth: 1
      - name: Reconcile canonical state and continuity from verified live evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import copy, hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          state_path = root / 'docs/zuvyr/ZUVYR_CURRENT_STATE_OVERRIDE_2026-09-23.json'
          manifest_path = root / 'docs/zuvyr/ZUVYR_CONTINUITY_MANIFEST.json'
          receipt_rel = 'zuvyr-pack-evidence/pack-089/2026-09-24-89e-connected-current-reconciliation/receipt.json'
          receipt_path = root / receipt_rel
          source_main = '87e3451cb05b4c197d6d89d49c90cd7bed13685f'
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          active = state.setdefault('active_work', {})
          active.update({
            'pack': 'PACK089',
            'pack_status': 'IN_PROGRESS',
            'phase': '89E_PRODUCTION_ACCEPTANCE',
            'phase_status': 'OAUTH_CONNECTED_FINAL_ACCEPTANCE_PENDING',
            'pack090_allowed': False,
            'latest_receipt': receipt_rel,
            'google_oauth_values_or_google_side_validity': 'PRODUCTION_OWNER_CONSENT_AND_CALLBACK_CONFIRMED',
            'interactive_owner_consent_completed': True,
            'next_legal_step': 'Verify a granted-scope Google Drive read/export tool call, prove denied write/scope behavior, disconnect/revoke, prove post-revoke denial, then verify audit persistence and Vault/plaintext-secret cleanliness. Do not start PACK090 first.'
          })
          active['oauth_callback_production'] = {
            'status': 'PASS_OWNER_CONSENT_CALLBACK_COMPLETED',
            'checked_through': now
          }
          active['google_testing_audience'] = {
            'status': 'RESOLVED_OWNER_CONSENT_COMPLETED',
            'previous_status': 'BLOCKED_TEST_USER_ALLOWLIST',
            'resolution_evidence': 'Fresh production DB shows one active connected Google Drive connection after one consumed OAuth session.'
          }
          active['google_drive_connection_current'] = {
            'status': 'active',
            'connected': True,
            'scopes': ['drive.export', 'drive.file.read'],
            'explicit_consent': True,
            'read_enabled': True,
            'write_enabled': False,
            'consumed_oauth_sessions': 1,
            'active_unconsumed_oauth_sessions': 0,
            'credential_storage': 'VAULT_BACKED',
            'observed_from': 'fresh Supabase production evidence 2026-09-24'
          }
          active['pack089_pkce_cleanup'] = {
            'status': 'PRODUCTION_VERIFIED',
            'merged_pr': 123,
            'expired_unconsumed_sessions': 3,
            'historical_pkce_secret_references_preserved': 3,
            'live_expired_pkce_vault_secrets': 0,
            'cleanup_audit_event_observed': True,
            'maintenance_runs_observed_success': True,
            'interpretation': 'Session rows and secret UUID references are intentionally preserved for audit; corresponding Vault secret rows are deleted.'
          }

          state['schema_version'] = '1.8'
          state['updated_at'] = now
          state['repository'] = 'ismaildormi/ZUVYR-AI'
          state['source_main_before_this_reconciliation'] = source_main
          infra = state.setdefault('infrastructure', {})
          infra['supabase_project'] = 'tqoqsgaymygmqrzddvtu'
          infra['supabase_status'] = 'ACTIVE_HEALTHY_EU_WEST_1_PROVIDER_LIFECYCLE_INCIDENT_MONITORED'
          infra['railway_services_latest_status'] = 'SUCCESS_ON_MAIN_87E3451'
          infra['vercel_post_reconciliation_main_behavior'] = 'Main 87e3451cb05b4c197d6d89d49c90cd7bed13685f has fresh Vercel SUCCESS after build-rate-limit cooldown recovery.'
          infra['vercel_runtime_interpretation'] = 'Build-rate-limit was observed as an external deployment-evidence blocker and later recovered; current main Vercel status is success. Do not treat the provider incident as a ZUVYR code fix.'
          gates = state.setdefault('known_unresolved_gates', [])
          pack089_gate = 'PACK089 final Google Drive production acceptance: granted read/export call, denied write/scope proof, disconnect/revoke, post-revoke denial, audit persistence and Vault/plaintext-secret cleanliness'
          gates = [x for x in gates if not (isinstance(x, str) and x.startswith('PACK089'))]
          state['known_unresolved_gates'] = [pack089_gate] + gates

          receipt = {
            'schema_version': '1.0',
            'pack': '089',
            'phase': '89E_PRODUCTION_ACCEPTANCE',
            'status': 'OAUTH_CONNECTED_FINAL_ACCEPTANCE_PENDING',
            'observed_at': now,
            'source_main': source_main,
            'evidence': {
              'repository': 'ismaildormi/ZUVYR-AI',
              'google_oauth_owner_consent_completed': True,
              'oauth_callback_completed': True,
              'google_drive_connection': {
                'status': 'active', 'connected': True,
                'scopes': ['drive.export', 'drive.file.read'],
                'explicit_consent': True, 'read_enabled': True, 'write_enabled': False,
                'credential_storage': 'VAULT_BACKED'
              },
              'oauth_sessions': {'consumed': 1, 'active_unconsumed': 0},
              'expired_unconsumed_sessions': 3,
              'expired_session_historical_pkce_refs': 3,
              'live_expired_pkce_vault_secrets': 0,
              'pkce_cleanup_audit_event_observed': True,
              'maintenance_cleanup_observed_success': True,
              'supabase_project_status': 'ACTIVE_HEALTHY',
              'supabase_eu_west_1_provider_lifecycle_incident': 'EXTERNAL_MONITOR',
              'main_87e3451_combined_status': 'VERCEL_PLUS_RAILWAY_BACKEND_WORKER_MAINTENANCE_SUCCESS'
            },
            'interpretation': {
              'pack089_complete': False,
              'pack090_started': False,
              'historical_pkce_refs_are_not_live_secrets': True,
              'remaining_gate': 'GRANTED_CALL_DENIED_WRITE_REVOKE_POST_REVOKE_AUDIT_SECRET_CLEANLINESS'
            },
            'next': {
              'pack090_allowed': False,
              'required_sequence': 'granted read/export call -> denied write/scope proof -> disconnect/revoke -> post-revoke denial -> audit persistence -> Vault/plaintext-secret cleanliness'
            }
          }

          def dump(path, obj):
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def blob_sha(path):
            data = path.read_bytes()
            return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          dump(receipt_path, receipt)
          dump(state_path, state)
          state_sha = blob_sha(state_path)
          package_sha = blob_sha(root / 'package.json')

          manifest['schema_version'] = '2.8'
          manifest['updated_at'] = now
          manifest['repository'] = 'ismaildormi/ZUVYR-AI'
          manifest.setdefault('current_state_override', {})['path'] = str(state_path)
          manifest['current_state_override']['blob_sha'] = state_sha
          manifest['active_work'] = copy.deepcopy(state['active_work'])
          manifest.setdefault('canonical_files_snapshot', {})[str(state_path)] = state_sha
          manifest.setdefault('integrity_guard_files', {})['package.json'] = package_sha
          manifest['last_reconciled_git_head_before_manifest_update'] = source_main
          manifest.setdefault('recent_reconciled_hardening', {})['pack089_pkce_cleanup_2026_09_24'] = {
            'status': 'PRODUCTION_VERIFIED',
            'pr': 123,
            'live_expired_pkce_vault_secrets': 0,
            'historical_session_secret_refs_preserved': 3,
            'audit_event_observed': True
          }
          infra_m = manifest.setdefault('infrastructure', {})
          infra_m['supabase_project'] = 'tqoqsgaymygmqrzddvtu'
          infra_m['supabase_status'] = 'ACTIVE_HEALTHY_EU_WEST_1_PROVIDER_LIFECYCLE_INCIDENT_MONITORED'
          infra_m['railway_services_latest_status'] = 'SUCCESS_ON_MAIN_87E3451'
          infra_m['vercel_post_reconciliation_main_behavior'] = 'Main 87e3451cb05b4c197d6d89d49c90cd7bed13685f has fresh Vercel SUCCESS after build-rate-limit cooldown recovery.'
          infra_m['vercel_runtime_interpretation'] = 'Current main Vercel status is success. Previous build-rate-limit was an external provider quota/cooldown gate and is not relabeled as a ZUVYR code fix.'
          manifest['known_unresolved_gates'] = copy.deepcopy(state['known_unresolved_gates'])
          dump(manifest_path, manifest)

          # The guard hashes must describe the final current-state/package bytes.
          verify_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert verify_manifest['current_state_override']['blob_sha'] == blob_sha(state_path)
          assert verify_manifest['canonical_files_snapshot'][str(state_path)] == blob_sha(state_path)
          assert verify_manifest['integrity_guard_files']['package.json'] == blob_sha(root / 'package.json')
          assert state['active_work']['pack090_allowed'] is False
          assert receipt['next']['pack090_allowed'] is False
          PY

          node tools/validate-zuvyr-continuity.cjs
          rm -f .github/workflows/_zuvyr-one-shot-continuity-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: reconcile current ZUVYR continuity and PACK089 evidence'
          git push origin HEAD:fix/level3-brand-current-main-20260924
