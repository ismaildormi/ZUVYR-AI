name: ZUVYR Native Level 3 Product Fixes Once

on:
  push:
    branches:
      - feat/zuvyr-live-ops-level2-3-20260924

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/zuvyr-live-ops-level2-3-20260924
          fetch-depth: 1

      - name: Apply evidence-based product fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) PACK095 helpers were accidentally scoped inside PACK094.
          ux_path=Path('frontend/zuvyr-unified-ux-v1.js')
          ux=ux_path.read_text()
          marker='/* ZUVYR PACK095 MODEL LAB */'
          m95=ux.index(marker)
          start=ux.index('  function candidateRows() {', 0, m95)
          end=ux.index('  function render() {', start, m95)
          helper_block=ux[start:end]
          expected=['candidateRows','failureRows','skillRows','curriculumRows','benchmarkRows','evaluationRows','syntheticRows']
          for name in expected:
              if f'function {name}(' not in helper_block:
                  raise SystemExit(f'missing PACK095 helper in misplaced block: {name}')
          ux=ux[:start]+ux[end:]
          m95=ux.index(marker)
          insert_at=ux.index('  function selectOptions(', m95)
          ux=ux[:insert_at]+helper_block+ux[insert_at:]
          ux_path.write_text(ux)

          # 2) Library form accessible names.
          lib_path=Path('frontend/zuvyr-library-v1.js')
          lib=lib_path.read_text()
          replacements={
            '<select data-f="kind">':'<select data-f="kind" aria-label="Content type">',
            '<select data-f="state">':'<select data-f="state" aria-label="Item state">',
            '<input data-f="from" type="date">':'<input data-f="from" type="date" aria-label="From date">',
            '<input data-f="to" type="date">':'<input data-f="to" type="date" aria-label="To date">',
          }
          for old,new in replacements.items():
              if old not in lib: raise SystemExit(f'library marker missing: {old}')
              lib=lib.replace(old,new,1)
          lib_path.write_text(lib)

          # 3) Memory select accessible names.
          mem_path=Path('frontend/zuvyr-memory-v1.js')
          mem=mem_path.read_text()
          replacements={
            '<select data-m-create="scope">':'<select data-m-create="scope" aria-label="Memory scope">',
            '<select data-m-create="category">':'<select data-m-create="category" aria-label="Memory category">',
            '<select data-m-filter="scope">':'<select data-m-filter="scope" aria-label="Filter by scope">',
            '<select data-m-filter="category">':'<select data-m-filter="category" aria-label="Filter by category">',
          }
          for old,new in replacements.items():
              if old not in mem: raise SystemExit(f'memory marker missing: {old}')
              mem=mem.replace(old,new,1)
          mem_path.write_text(mem)

          # 4) Code Studio project selector accessible name (one legacy occurrence lacked it).
          suite_path=Path('frontend/zuvyr-suite-v1.js')
          suite=suite_path.read_text()
          old='<select data-zs-code-project-select>'
          if old not in suite: raise SystemExit('legacy Code project selector marker missing')
          suite=suite.replace(old,'<select data-zs-code-project-select aria-label="Code project">',1)
          suite_path.write_text(suite)

          # 5) Projects primary action: white text must meet WCAG AA against the orange background.
          proj_path=Path('frontend/zuvyr-projects-v1.css')
          proj=proj_path.read_text()
          old='.zuvyr-project-primary{background:var(--accent,#7c3aed);color:#fff}'
          if old not in proj: raise SystemExit('projects primary color marker missing')
          proj=proj.replace(old,'.zuvyr-project-primary{background:#c2410c;color:#fff}',1)
          proj_path.write_text(proj)

          # 6) Library desktop grid must shrink inside the screen instead of expanding to min-content width.
          libcss_path=Path('frontend/zuvyr-library-v1.css')
          libcss=libcss_path.read_text()
          patch='''\n/* Level 3 responsive containment */\n.zuvyr-library-shell,.zuvyr-library-hero,.zuvyr-library-filters,.zuvyr-library-layout{min-width:0;max-width:100%}\n.zuvyr-library-filters{grid-template-columns:minmax(0,2fr) repeat(7,minmax(0,1fr)) auto}\n.zuvyr-library-filters input,.zuvyr-library-filters select{min-width:0;width:100%;box-sizing:border-box}\n@media(max-width:1100px){.zuvyr-library-filters{grid-template-columns:repeat(3,minmax(0,1fr))}}\n@media(max-width:820px){.zuvyr-library-filters{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:520px){.zuvyr-library-filters{grid-template-columns:minmax(0,1fr)}}\n'''
          if '/* Level 3 responsive containment */' not in libcss:
              libcss += patch
          libcss_path.write_text(libcss)

          # 7) Native QA: same-origin media is intentionally stubbed; keep API/static network failures strict.
          qa_path=Path('tools/visual-qa/native-run.mjs')
          qa=qa_path.read_text()
          old="if(url.origin===new URL(baseUrl).origin){\n      const rel=url.pathname.replace(/^\\/+/, '');"
          new="if(url.origin===new URL(baseUrl).origin){\n      if(req.resourceType()==='media')return route.fulfill({status:204,body:''});\n      const rel=url.pathname.replace(/^\\/+/, '');"
          if old not in qa: raise SystemExit('native QA same-origin routing marker missing')
          qa=qa.replace(old,new,1)
          old_ret='scrollWidth:el.scrollWidth,clientWidth:Math.round(rootRect.width),overflowElements,duplicateIds,colorInventory:'
          new_ret='scrollWidth:el.scrollWidth,clientWidth:Math.round(rootRect.width),overflowElements,scrollOffenders:visible.map(node=>({tag:node.tagName,id:node.id||null,className:String(node.className||\'\').slice(0,180),scrollWidth:node.scrollWidth,clientWidth:node.clientWidth,text:(node.textContent||\'\').trim().replace(/\\s+/g,\' \').slice(0,100)})).filter(x=>x.scrollWidth>x.clientWidth+3).sort((a,b)=>(b.scrollWidth-b.clientWidth)-(a.scrollWidth-a.clientWidth)).slice(0,40),duplicateIds,colorInventory:'
          if old_ret not in qa: raise SystemExit('native QA evidence return marker missing')
          qa=qa.replace(old_ret,new_ret,1)
          qa_path.write_text(qa)

          # 8) Dedicated native responsive layer: contain feature canvases and make mobile controls usable.
          responsive=Path('frontend/zuvyr-native-responsive-fixes.css')
          responsive.write_text('''/* ZUVYR native responsive fixes — Level 3 QA */\n@media (max-width:760px){\n  body.zuvyr-ui :is(#feature-images,#feature-videos,#feature-roxip,#feature-chat,#feature-code,#feature-automations,#feature-history,#feature-settings)>.feature-screen{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important;overflow-x:hidden!important}\n  body.zuvyr-ui #feature-settings .rox-settings-nav{display:flex!important;width:100%!important;max-width:100%!important;min-width:0!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;overscroll-behavior-inline:contain;scrollbar-width:none}\n  body.zuvyr-ui #feature-settings .rox-settings-nav::-webkit-scrollbar{display:none}\n  body.zuvyr-ui #feature-settings .rox-settings-nav>button{flex:0 0 auto!important}\n  body.zuvyr-ui #feature-chat .zuvyr-chat-main>.chat-input-row{display:flex!important;flex-wrap:wrap!important;align-content:center!important;width:calc(100% - 20px)!important;min-width:0!important;min-height:108px!important;padding:9px!important;gap:6px!important;box-sizing:border-box!important}\n  body.zuvyr-ui #feature-chat .chat-input-row :is(input,textarea)[data-feature="chat"]{order:-20!important;display:block!important;flex:1 0 100%!important;width:100%!important;min-width:0!important;max-width:100%!important;height:40px!important;min-height:40px!important;padding:5px 8px!important;box-sizing:border-box!important}\n  body.zuvyr-ui #feature-chat .chat-input-row>.zuvyr-attach-button,\n  body.zuvyr-ui #feature-chat .chat-input-row>button:not([data-send="chat"]),\n  body.zuvyr-ui #feature-chat .chat-input-row .zuvyr-web-search-toggle{flex:0 0 38px!important;width:38px!important;min-width:38px!important;max-width:38px!important;height:38px!important;padding:0!important}\n  body.zuvyr-ui #feature-chat .chat-input-row .rox-voice-language{flex:0 0 48px!important;min-width:48px!important;max-width:48px!important}\n  body.zuvyr-ui #feature-chat .chat-input-row .voice-input-btn,\n  body.zuvyr-ui #feature-chat .chat-input-row>button[data-send="chat"]{flex:0 0 40px!important;width:40px!important;min-width:40px!important;max-width:40px!important;height:40px!important}\n  body.zuvyr-ui #feature-chat .zuvyr-chat-main:has(#msgs-chat.zuvyr-chat-empty)>.chat-input-row{bottom:calc(50% - 158px)!important}\n}\n''')

          index_path=Path('frontend/index.html')
          index=index_path.read_text()
          href='<link rel="stylesheet" href="zuvyr-native-responsive-fixes.css">'
          if href not in index:
              if '</head>' not in index: raise SystemExit('index head marker missing')
              index=index.replace('</head>',href+'\n</head>',1)
          index_path.write_text(index)
          PY

          node --check frontend/zuvyr-unified-ux-v1.js
          node --check frontend/zuvyr-library-v1.js
          node --check frontend/zuvyr-memory-v1.js
          node --check frontend/zuvyr-suite-v1.js
          node --check tools/visual-qa/native-run.mjs
          git diff --check

      - name: Commit product fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zuvyr-native-level3-product-fixes-once.yml
          git add frontend/zuvyr-unified-ux-v1.js frontend/zuvyr-library-v1.js frontend/zuvyr-memory-v1.js frontend/zuvyr-suite-v1.js frontend/zuvyr-projects-v1.css frontend/zuvyr-library-v1.css frontend/zuvyr-native-responsive-fixes.css frontend/index.html tools/visual-qa/native-run.mjs
          git commit -m "fix: close native Level 3 product findings"
          git push origin HEAD:feat/zuvyr-live-ops-level2-3-20260924
