name: ZUVYR Native Level 3 Final Fix Once
on:
  push:
    branches:
      - feat/zuvyr-live-ops-level2-3-20260924
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/zuvyr-live-ops-level2-3-20260924
          fetch-depth: 1
      - name: Apply remaining Level 3 mobile containment fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('frontend/rox-brand-blue-violet.css')
          css = css_path.read_text()
          marker = '/* ZUVYR NATIVE LEVEL 3 MOBILE CONTAINMENT V1 */'
          if marker in css:
              raise SystemExit('mobile containment block already exists')
          css += '''\n\n/* ZUVYR NATIVE LEVEL 3 MOBILE CONTAINMENT V1 */\n@media (max-width: 760px) {\n  body.zuvyr-ui .feature-screen::before,\n  body.zuvyr-ui .feature-screen::after {\n    display: none !important;\n  }\n\n  body.zuvyr-ui #feature-settings .rox-settings-nav {\n    width: 100% !important;\n    max-width: 100% !important;\n    min-width: 0 !important;\n    overflow-x: auto !important;\n    overflow-y: hidden !important;\n    overscroll-behavior-inline: contain;\n    -webkit-overflow-scrolling: touch;\n    scrollbar-width: none;\n  }\n\n  body.zuvyr-ui #feature-settings .rox-settings-nav::-webkit-scrollbar {\n    display: none;\n  }\n}\n'''
          css_path.write_text(css)
          PY
          git diff --check
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/zuvyr-native-level3-final-fix-once.yml
          git add frontend/rox-brand-blue-violet.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: contain native mobile decorative overflow'
          git push origin HEAD:feat/zuvyr-live-ops-level2-3-20260924
