name: Security Diagnostics Learning

on:
  pull_request:
    paths:
      - 'backend/config/security-diagnostics-learning.v1.json'
      - 'backend/lib/securityDiagnosticsLearning.js'
      - 'backend/test-security-diagnostics-learning.js'
      - 'docs/zuvyr/SECURITY_DIAGNOSTICS_LEARNING.md'
      - '.github/workflows/security-diagnostics-learning.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/config/security-diagnostics-learning.v1.json'
      - 'backend/lib/securityDiagnosticsLearning.js'
      - 'backend/test-security-diagnostics-learning.js'
      - 'docs/zuvyr/SECURITY_DIAGNOSTICS_LEARNING.md'
      - '.github/workflows/security-diagnostics-learning.yml'

permissions:
  contents: read

jobs:
  governed-learning-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate security diagnostics learning/privacy/eval foundation
        run: node backend/test-security-diagnostics-learning.js
