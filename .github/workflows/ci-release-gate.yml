name: ZUVYR Release Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zuvyr-release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-quality:
    name: Release Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Verify immutable GitHub Action pins
        run: node tools/test-github-action-pins.cjs

      - name: Verify public builder resources
        run: |
          node --check examples/patterns/idempotent-task.js
          node --check examples/patterns/permission-bound-action.js
          node --check examples/patterns/reserve-settle-refund.js
          node starter-kits/durable-ai-job/src/index.js
          node starter-kits/permissioned-tool/src/index.js
          node starter-kits/provider-router/src/index.js

      - name: Verify validator scope
        run: node tools/test-release-validator-scope.js

      - name: Verify CLI plugin trust boundary
        run: node cli/tests/test-plugin-trust-boundary.js

      - name: Validate release contracts
        run: npm run validate:release

      - name: Verify CI gate contract
        run: node tools/test-ci-release-gate.js

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend unit and safety tests
        run: npm run test:unit

      - name: Verify full-control undo boundary
        run: node ../device-agent/test/pack087-full-control-undo-hardening.test.js

      - name: Verify STOP-channel risk fail-closed behavior
        run: node ../device-agent/test/pack087-stop-channel-hardening.test.js

      - name: Verify STOP direct-child termination boundary
        run: node ../device-agent/test/pack087-stop-termination-hardening.test.js

      - name: Verify STOP descendant-tree termination boundary
        run: node ../device-agent/test/pack087-stop-process-tree-hardening.test.js

      - name: Run maintenance strategy tests
        run: npm run test:maintenance

      - name: Verify readiness gate source
        run: node test-readiness-gates.js

      - name: Verify liveness and shutdown source
        run: node test-readiness-lifecycle.js

  device-agent-stop-cross-platform:
    name: Device STOP (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify direct-child STOP escalation
        run: node device-agent/test/pack087-stop-termination-hardening.test.js

      - name: Verify descendant-tree STOP ownership
        run: node device-agent/test/pack087-stop-process-tree-hardening.test.js
