name: PACK089 Drive owner acceptance one-shot

on:
  push:
    branches:
      - fix/pack089-drive-browse-acceptance-20260924

permissions:
  contents: write

jobs:
  patch-test-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pack089-drive-browse-acceptance-20260924
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply scoped patch
        run: node tools/pack089-drive-acceptance-patch-once.cjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate PACK089 connections
        working-directory: backend
        run: npm run test:connections

      - name: Validate continuity and diff hygiene
        run: |
          node tools/validate-zuvyr-continuity.cjs
          git diff --check

      - name: Commit scoped fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pack089-drive-browse-acceptance-once.yml
          git rm tools/pack089-drive-acceptance-patch-once.cjs
          git add frontend/zuvyr-suite-v1.js backend/test-pack089-89d-product-ui.js
          git commit -m "fix: add PACK089 owner Drive acceptance controls"
          git push origin HEAD:fix/pack089-drive-browse-acceptance-20260924
