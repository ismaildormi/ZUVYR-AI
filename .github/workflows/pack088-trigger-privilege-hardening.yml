name: PACK088 Trigger Privilege Hardening

on:
  pull_request:
    paths:
      - 'backend/92_pack088_88d_ui_notifications_pause_cancel.sql'
      - 'backend/92_pack088_88d_trigger_privilege_hardening.sql'
      - 'backend/test-pack088-trigger-privilege-hardening.js'
      - '.github/workflows/pack088-trigger-privilege-hardening.yml'
  push:
    branches: [main]
    paths:
      - 'backend/92_pack088_88d_ui_notifications_pause_cancel.sql'
      - 'backend/92_pack088_88d_trigger_privilege_hardening.sql'
      - 'backend/test-pack088-trigger-privilege-hardening.js'
      - '.github/workflows/pack088-trigger-privilege-hardening.yml'

permissions:
  contents: read

jobs:
  privilege-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify PACK088 trigger privilege contract
        run: node backend/test-pack088-trigger-privilege-hardening.js
