name: QH002 STOP termination one-shot

on:
  push:
    branches:
      - audit/v1-quality-hardening-20260925
    paths:
      - .github/workflows/qh002-stop-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/v1-quality-hardening-20260925
          fetch-depth: 0

      - name: Apply bounded STOP process-tree hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('device-agent/src/actionExecutor.js')
          source = target.read_text(encoding='utf-8')
          start = source.index('function collectChild(')
          end = source.index('function backupsDir(', start)
          replacement = r'''function posixProcessGroupAlive(pid) {
            if (process.platform === 'win32' || !Number.isInteger(pid) || pid <= 0) return false;
            try {
              process.kill(-pid, 0);
              return true;
            } catch (error) {
              return error && error.code === 'EPERM';
            }
          }

          function signalOwnedProcessTree(child, signal) {
            if (!child || !Number.isInteger(child.pid) || child.pid <= 0) return false;
            if (process.platform === 'win32') {
              if (signal === 'SIGKILL') {
                const result = spawnSync('taskkill.exe', ['/PID', String(child.pid), '/T', '/F'], {
                  windowsHide: true,
                  stdio: 'ignore',
                  timeout: 2500
                });
                return result.status === 0 || result.status === 128;
              }
              try { return child.kill('SIGTERM'); } catch (_) { return false; }
            }
            try {
              process.kill(-child.pid, signal);
              return true;
            } catch (_) {
              try { return child.kill(signal); } catch (_) { return false; }
            }
          }

          function collectChild(child, { input = null, signal, timeoutMs = DEFAULT_TIMEOUT_MS } = {}) {
            return new Promise((resolve, reject) => {
              const stdout = [];
              const stderr = [];
              let stdoutBytes = 0;
              let stderrBytes = 0;
              let done = false;
              let directExited = false;
              let terminationCode = null;
              let terminationCause = null;
              let timer = null;
              let escalationTimer = null;
              let confirmTimer = null;
              let confirmPoll = null;

              const ownedTreeAlive = () => {
                if (process.platform === 'win32') return !directExited;
                return posixProcessGroupAlive(child.pid);
              };

              const finish = (error, result) => {
                if (done) return;
                done = true;
                if (timer) clearTimeout(timer);
                if (escalationTimer) clearTimeout(escalationTimer);
                if (confirmTimer) clearTimeout(confirmTimer);
                if (confirmPoll) clearInterval(confirmPoll);
                if (signal) signal.removeEventListener('abort', onAbort);
                if (error) reject(error);
                else resolve(result);
              };

              const finishTerminationIfConfirmed = () => {
                if (!terminationCode || done || ownedTreeAlive()) return;
                finish(actionError(terminationCode, {
                  treeTerminated: true,
                  cause: terminationCause ? String(terminationCause.message || terminationCause) : null
                }));
              };

              const forceTree = () => {
                if (done) return;
                signalOwnedProcessTree(child, 'SIGKILL');
                finishTerminationIfConfirmed();
              };

              const requestTermination = code => {
                if (done || terminationCode) return;
                terminationCode = code;
                if (timer) {
                  clearTimeout(timer);
                  timer = null;
                }

                if (process.platform === 'win32') {
                  // Windows has no portable Node process-group kill. taskkill /T /F is the
                  // native tree primitive and must run while the parent PID still owns children.
                  forceTree();
                } else {
                  // spawnCaptured creates a dedicated process group on POSIX. Give the entire
                  // group a short graceful window, then force-kill any stubborn descendant.
                  signalOwnedProcessTree(child, 'SIGTERM');
                  escalationTimer = setTimeout(forceTree, 500);
                  escalationTimer.unref?.();
                }

                confirmPoll = setInterval(finishTerminationIfConfirmed, 25);
                confirmPoll.unref?.();
                confirmTimer = setTimeout(() => {
                  if (done) return;
                  forceTree();
                  if (!ownedTreeAlive()) {
                    finishTerminationIfConfirmed();
                    return;
                  }
                  finish(actionError('pack087_action_termination_unconfirmed', {
                    requestedCode: code,
                    pid: child.pid,
                    platform: process.platform
                  }));
                }, 3000);
                confirmTimer.unref?.();
                finishTerminationIfConfirmed();
              };

              const onAbort = () => requestTermination('pack087_action_stopped');

              child.stdout?.on('data', chunk => {
                if (stdoutBytes >= MAX_STDIO_BYTES) return;
                const piece = Buffer.from(chunk).subarray(0, MAX_STDIO_BYTES - stdoutBytes);
                stdout.push(piece);
                stdoutBytes += piece.length;
              });
              child.stderr?.on('data', chunk => {
                if (stderrBytes >= MAX_STDIO_BYTES) return;
                const piece = Buffer.from(chunk).subarray(0, MAX_STDIO_BYTES - stderrBytes);
                stderr.push(piece);
                stderrBytes += piece.length;
              });
              child.once('error', error => {
                if (terminationCode) {
                  terminationCause = error;
                  finishTerminationIfConfirmed();
                  return;
                }
                finish(error);
              });
              child.once('exit', (code, sig) => {
                directExited = true;
                if (terminationCode) {
                  finishTerminationIfConfirmed();
                  return;
                }
                finish(null, {
                  code: Number.isInteger(code) ? code : null,
                  signal: sig || null,
                  stdout: Buffer.concat(stdout).toString('utf8'),
                  stderr: Buffer.concat(stderr).toString('utf8'),
                  stdoutTruncated: stdoutBytes >= MAX_STDIO_BYTES,
                  stderrTruncated: stderrBytes >= MAX_STDIO_BYTES
                });
              });

              if (signal) {
                signal.addEventListener('abort', onAbort, { once: true });
                if (signal.aborted) onAbort();
              }
              if (!terminationCode) {
                timer = setTimeout(() => requestTermination('pack087_action_timeout'), timeoutMs);
                timer.unref?.();
              }
              if (child.stdin) {
                if (!terminationCode && input !== null && input !== undefined) child.stdin.write(String(input));
                child.stdin.end();
              }
            });
          }

          async function spawnCaptured(command, args, options = {}) {
            if (!command || !Array.isArray(args)) throw actionError('pack087_spawn_invalid');
            const child = spawn(command, args, {
              cwd: options.cwd || undefined,
              env: options.env || process.env,
              shell: false,
              windowsHide: true,
              detached: process.platform !== 'win32',
              stdio: ['pipe', 'pipe', 'pipe']
            });
            return collectChild(child, options);
          }

          '''
          target.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY

      - name: Verify patched source and regressions
        run: |
          node --check device-agent/src/actionExecutor.js
          node device-agent/test/pack087-full-control-undo-hardening.test.js
          node device-agent/test/pack087-stop-channel-hardening.test.js
          node device-agent/test/pack087-stop-termination-hardening.test.js
          node device-agent/test/pack087-stop-process-tree-hardening.test.js

      - name: Commit scoped patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/qh002-stop-apply.yml
          git config user.name "ismaildormi"
          git config user.email "dormiismail02@gmail.com"
          git add device-agent/src/actionExecutor.js device-agent/test/pack087-stop-process-tree-hardening.test.js
          git add -u .github/workflows/qh002-stop-apply.yml
          git diff --cached --check
          git commit -m "fix(device-agent): terminate owned process tree before STOP receipt"
          git push origin HEAD:audit/v1-quality-hardening-20260925
