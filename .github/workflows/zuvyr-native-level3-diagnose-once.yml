name: ZUVYR Native Level 3 Diagnose Once

on:
  push:
    branches:
      - feat/zuvyr-live-ops-level2-3-20260924

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/zuvyr-live-ops-level2-3-20260924
          fetch-depth: 1

      - name: Apply deterministic QA corrections and overflow evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path=Path('frontend/index.html')
          html=index_path.read_text()
          old='<h3 data-i18n="nav.chat">AI Chat</h3>'
          count=html.count(old)
          if count < 2:
              raise SystemExit(f'expected >=2 remaining static AI Chat headings, got {count}')
          html=html.replace(old,'<h3 aria-level="2" data-i18n="nav.chat">AI Chat</h3>')
          index_path.write_text(html)

          qa_path=Path('tools/visual-qa/native-run.mjs')
          qa=qa_path.read_text()

          old_route="if(url.origin===new URL(baseUrl).origin)return route.continue();"
          new_route="""if(url.origin===new URL(baseUrl).origin){
      const rel=url.pathname.replace(/^\\/+/, '');
      if(!rel.startsWith('frontend/')&&!rel.startsWith('tools/')&&/\\.(?:js|css|png|svg|webp|jpg|jpeg|ico)$/i.test(rel)){
        return route.continue({url:`${baseUrl}/frontend/${rel}${url.search}`});
      }
      return route.continue();
    }"""
          if qa.count(old_route)!=1:
              raise SystemExit(f'expected one same-origin route clause, got {qa.count(old_route)}')
          qa=qa.replace(old_route,new_route,1)

          old_root="""const rootRect=el.getBoundingClientRect();
    const duplicateIds="""
          new_root="""const rootRect=el.getBoundingClientRect();
    const overflowElements=visible.map(node=>{const r=node.getBoundingClientRect();return {tag:node.tagName,id:node.id||null,className:String(node.className||'').slice(0,180),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),scrollWidth:node.scrollWidth,clientWidth:node.clientWidth,text:(node.textContent||'').trim().replace(/\\s+/g,' ').slice(0,120),outsideLeft:r.left<rootRect.left-3,outsideRight:r.right>rootRect.right+3};}).filter(x=>x.outsideLeft||x.outsideRight).sort((a,b)=>Math.max(Math.abs(b.left-rootRect.left),Math.abs(b.right-rootRect.right))-Math.max(Math.abs(a.left-rootRect.left),Math.abs(a.right-rootRect.right))).slice(0,40);
    const duplicateIds="""
          if qa.count(old_root)!=1:
              raise SystemExit(f'expected one rootRect block, got {qa.count(old_root)}')
          qa=qa.replace(old_root,new_root,1)

          old_return="""scrollWidth:el.scrollWidth,clientWidth:Math.round(rootRect.width),duplicateIds,colorInventory:"""
          new_return="""scrollWidth:el.scrollWidth,clientWidth:Math.round(rootRect.width),overflowElements,duplicateIds,colorInventory:"""
          if qa.count(old_return)!=1:
              raise SystemExit(f'expected one evidence return segment, got {qa.count(old_return)}')
          qa=qa.replace(old_return,new_return,1)
          qa_path.write_text(qa)
          PY

          node --check tools/visual-qa/native-run.mjs
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zuvyr-native-level3-diagnose-once.yml
          git add frontend/index.html tools/visual-qa/native-run.mjs
          git commit -m "test: harden native QA asset routing and overflow evidence"
          git push origin HEAD:feat/zuvyr-live-ops-level2-3-20260924
