name: Vercel Ignore Command

on:
  pull_request:
    paths:
      - 'vercel.json'
      - 'tools/test-vercel-ignore-command.cjs'
      - '.github/workflows/vercel-ignore-command.yml'
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'tools/test-vercel-ignore-command.cjs'
      - '.github/workflows/vercel-ignore-command.yml'

permissions:
  contents: read

jobs:
  ignored-build-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Verify ignored-build semantics
        run: node tools/test-vercel-ignore-command.cjs
