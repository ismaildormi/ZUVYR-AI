name: PACK089 QH Current-State Reconcile

on:
  push:
    branches:
      - finalize/pack089-owner-acceptance-20260926

permissions:
  contents: write

jobs:
  reconcile-qh-current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Reconcile QH current-state section
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='docs/zuvyr/V1_QUALITY_HARDENING_MATRIX_2026-09-25.md';
          let text=fs.readFileSync(p,'utf8');
          const start='## Current verified state\n';
          const end='\nNothing is marked `CLOSED` unless its finding-specific closure evidence is fully satisfied.';
          const s=text.indexOf(start);
          const e=text.indexOf(end,s);
          if(s<0||e<0) throw new Error('QH current-state section boundaries not found');
          if(text.indexOf(start,s+start.length)>=0) throw new Error('duplicate QH current-state section');
          const section=`## Current verified state\n\n- Merged hardening baseline: PRs \`#128\` through \`#131\`.\n- Merged PACK089 production fixes: CORS alias PR \`#132\`; deterministic Drive disconnect PR \`#133\`.\n- Verified owner-acceptance source main: \`9a1527df295de260777e3a2f73972c1b064858ae\`.\n- Vercel production: \`dpl_DSjPGX8jWXnJAx3k8dSiCFnWPjC4\` = **READY** on exact source main.\n- Railway backend: \`13b888ce-e6d9-4d31-a910-2462891f5340\` = **SUCCESS**.\n- PACK089 owner acceptance: **LOCKED_VERIFIED** — 19 Drive files read under owner-scoped session permission; write scope blocked; deterministic disconnect/revoke succeeded; post-revoke challenge HTTP 400; audit persisted; active grants=0; Vault/PKCE rows=0; no plaintext token-like public columns; no external write executed.\n- PACK089 receipt: \`zuvyr-pack-evidence/pack-089/2026-09-26-89e-owner-acceptance-locked/receipt.json\`.\n- QH-016: **CLOSED**.\n- PACK090: **ALLOWED after finalizer merge, but not started by the PACK089 finalizer; canonical first action is the fresh universal-browser gap audit.**\n- Paid billing: **explicitly kept OFF during development**.\n\nRemaining mapped release gates are unchanged: QH-001/002/003/004 retain their later final rehearsal mappings; QH-012 remains the external branch-protection admin gate; QH-013 remains the Supabase capability gate; QH-014 remains mapped to PACK141/PACK142 evidence; QH-015 remains the PACK149/150 final exact-release deployment gate.\n`;
          text=text.slice(0,s)+section+text.slice(e);
          fs.writeFileSync(p,text,'utf8');
          console.log('PACK089_QH_CURRENT_STATE_RECONCILED');
          NODE

      - name: Verify clean patch formatting
        run: git diff --check

      - name: Commit reconcile result and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pack089-qh-current-state-reconcile.yml
          git add docs/zuvyr/V1_QUALITY_HARDENING_MATRIX_2026-09-25.md
          git diff --cached --stat
          git commit -m "docs(pack089): reconcile final owner-acceptance hardening state"
          git push origin HEAD:finalize/pack089-owner-acceptance-20260926
