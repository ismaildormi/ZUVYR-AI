<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZUVYR Visual QA Harness</title>
  <link rel="stylesheet" href="../../frontend/zuvyr-suite-v1.css">
  <style>
    :root{color-scheme:dark;--bg:#070a0f;--panel:#0e1420;--text:#edf2f7;--muted:#94a3b8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .visual-host{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
    .sidebar{min-height:100vh;border-right:1px solid rgba(148,163,184,.16);background:#0a0f18;padding:20px 14px}
    .brand{font-weight:800;letter-spacing:.32em;margin:4px 10px 28px}
    .nav-list{display:grid;gap:8px}.nav-list button{min-height:44px;border:1px solid rgba(148,163,184,.18);border-radius:12px;background:#101827;color:var(--text);text-align:left;padding:0 14px}
    .visual-main{min-width:0;padding:20px}.screen{min-width:0}.screen:not(.active){display:none}
    #screen-home{padding:28px}.fixture-card{max-width:720px;padding:24px;border:1px solid rgba(148,163,184,.18);border-radius:18px;background:var(--panel)}
    #screen-more{display:none}.project-list{display:none}
    @media(max-width:820px){.visual-host{display:block}.sidebar{min-height:auto;border-right:0;border-bottom:1px solid rgba(148,163,184,.16);padding:12px}.brand{margin:4px 8px 12px}.nav-list{grid-template-columns:repeat(2,minmax(0,1fr))}.visual-main{padding:10px}}
  </style>
</head>
<body>
  <div class="visual-host">
    <aside class="sidebar" aria-label="Fixture navigation">
      <div class="brand">ZUVYR</div>
      <div class="nav-list"><button type="button" data-tab="home">Home</button></div>
    </aside>
    <main class="visual-main">
      <section id="screen-home" class="screen active">
        <div class="fixture-card"><strong>Authenticated visual fixture</strong><p>Actual ZUVYR suite CSS and JavaScript are loaded below. API responses are deterministic and contain no customer data.</p></div>
      </section>
      <section id="screen-more" class="screen"><div class="project-list"></div></section>
      <section id="feature-code" class="screen"><div id="msgs-code"></div></section>
    </main>
  </div>
  <script>
    window.CONFIG={API_BASE:'https://visual-fixture.invalid'};
    window.ROX_RUNTIME_CONFIG={API_BASE:'https://visual-fixture.invalid'};
    const ok=(payload)=>new Response(JSON.stringify(payload),{status:200,headers:{'Content-Type':'application/json'}});
    const fixtureFor=(url)=>{
      const path=String(url||'');
      if(path.includes('/api/workspace/connections'))return {status:'success',connections:[]};
      if(path.includes('/api/workspace/plugins'))return {status:'success',plugins:[],items:[]};
      if(path.includes('/api/workspace/skills'))return {status:'success',skills:[],items:[]};
      if(path.includes('/api/automations/notifications'))return {status:'success',items:[]};
      if(path.includes('/api/automations'))return {status:'success',items:[]};
      if(path.includes('/api/zuvyr-usage-summary'))return {status:'success',plan:'pro',fiveHour:{state:'active',remaining:420,total:500},weekly:{state:'active',remaining:3200,total:4000},persistentTopupCredits:1200,recentRequests:[],warnings:{fiveHourRemainingPercentThreshold:20,weeklyRemainingPercentThreshold:15}};
      if(path.includes('/api/workspace/documents/templates'))return {status:'success',templates:[{id:'clean-report',name:'Clean report',category:'business',builtin:true,variables:[]}]};
      if(path.includes('/api/workspace/documents'))return {status:'success',items:[]};
      if(path.includes('/api/workspace/spreadsheets'))return {status:'success',items:[]};
      if(path.includes('/api/workspace/presentations'))return {status:'success',items:[]};
      if(path.includes('/api/roxip/devices'))return {status:'success',devices:[]};
      if(path.includes('/api/code-studio/capabilities'))return {status:'success',pack076:{liveProvisioning:false,blockers:['fixture_read_only']},pack077:{liveExecution:false,blockers:['fixture_read_only']},pack078:{livePreview:false,previewTransportVerified:false,blockers:['fixture_read_only']}};
      if(path.includes('/api/code-studio/projects'))return {status:'success',projects:[],items:[]};
      return {status:'success',items:[],history:[],capabilities:{},persisted:true};
    };
    window.authFetch=async function(url){return ok(fixtureFor(url));};
    window.supa={auth:{
      getSession:async()=>({data:{session:{access_token:'visual-fixture-token',user:{id:'00000000-0000-4000-8000-000000000001'}}}}),
      onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})
    }};
  </script>
  <script src="../../frontend/zuvyr-suite-v1.js"></script>
</body>
</html>
